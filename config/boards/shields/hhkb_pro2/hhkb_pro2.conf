# Use idle mode after 15 minutes of inactivity. Idle mode reduces activity
# while keeping the MCU and Bluetooth connection available for instant wake.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=900000

# Enable runtime keymap editing through ZMK Studio. The USB RPC endpoint is
# supplied by the studio-rpc-usb-uart snippet in build.yaml (or -S when
# building locally).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
