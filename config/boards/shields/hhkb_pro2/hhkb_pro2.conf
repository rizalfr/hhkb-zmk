# Enter sleep after 15 minutes of inactivity. The custom HHKB scanner keeps
# polling while asleep, so the first key press can wake the board and resume
# normal scanning/Bluetooth activity.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable runtime keymap editing through ZMK Studio. The USB RPC endpoint is
# supplied by the studio-rpc-usb-uart snippet in build.yaml (or -S when
# building locally).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
